name: Update GitHub stats cards

on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # manual run from the Actions tab
  push:
    paths:
      - scripts/fetch_stats.py

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats cards
        env:
          # Use a personal token (read:user scope) to include private contributions.
          # Falls back to the built-in token, which only sees public data.
          GITHUB_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/fetch_stats.py --user divyansh1502 --leetcode divyansh_5ingh

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gh-stats-wide.svg assets/gh-stats-mobile.svg data/stats.json
          git diff --cached --quiet || git commit -m "chore: update stats cards"
          git push
