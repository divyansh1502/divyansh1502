name: Update GitHub stats cards

on:
  schedule:
    - cron: "0 */6 * * *"      # every 6 hours
  workflow_dispatch:            # lets you run it by hand from the Actions tab
  push:
    paths:
      - "scripts/gh_stats.py"
      - ".github/workflows/github-stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOGIN: divyansh1502
        run: python scripts/gh_stats.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gh-stats-mobile.svg assets/gh-stats-wide.svg
          git diff --cached --quiet || git commit -m "chore: update GitHub stats cards"
          git push
