<rect x="287.5" y="175" width="70.5" height="26" rx="8" fill="#FFE08A"/><text x="322.8" y="191.6" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A2000">Manage</text>
<circle class="pk" cx="22" cy="188" r="3.6" fill="#fff" stroke="#B8860B" stroke-width="1.6" style="--d:336px"/>
<rect x="22" y="223" width="39.6" height="20" rx="10" fill="#FFC83D"/><text x="41.8" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A2000">Java</text>
<rect x="67.6" y="223" width="80.9" height="20" rx="10" fill="#FFE08A"/><text x="108" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A2000">Spring Boot</text>
<rect x="154.5" y="223" width="45.5" height="20" rx="10" fill="#FFC83D"/><text x="177.2" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A2000">React</text>
<rect x="206" y="223" width="45.5" height="20" rx="10" fill="#FFE08A"/><text x="228.8" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#2A2000">MySQL</text>
</g>
<rect x="4" y="4" width="372" height="253" rx="16" fill="none" stroke="#E0A800" stroke-width="1.6"/>
</svg>
