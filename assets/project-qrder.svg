<circle class="pk" cx="22" cy="188" r="3.6" fill="#fff" stroke="#9E1B1E" stroke-width="1.6" style="--d:376px"/>
<rect x="22" y="223" width="39.6" height="20" rx="10" fill="#E5383B"/><text x="41.8" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">Java</text>
<rect x="67.6" y="223" width="80.9" height="20" rx="10" fill="#9E1B1E"/><text x="108" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">Spring Boot</text>
<rect x="154.5" y="223" width="45.5" height="20" rx="10" fill="#E5383B"/><text x="177.2" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">React</text>
<rect x="206" y="223" width="45.5" height="20" rx="10" fill="#9E1B1E"/><text x="228.8" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">MySQL</text>
</g>
<rect x="4" y="4" width="412" height="253" rx="16" fill="none" stroke="#E5383B" stroke-width="1.6"/>
</svg>
