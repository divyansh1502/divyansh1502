<circle cx="26" cy="84" r="7.5" fill="#E5383B" fill-opacity=".16"/><g transform="translate(26 84)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#E5383B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">QR-based restaurant ordering</text>
<circle cx="26" cy="105" r="7.5" fill="#E5383B" fill-opacity=".16"/><g transform="translate(26 105)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#E5383B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="109" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Digital menus for every table</text>
