<text x="68" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#2A2000" fill-opacity=".9">Full-stack · Restaurant tech</text>
<rect x="279.6" y="17" width="84.4" height="22" rx="11" fill="#fff"/><circle cx="291.6" cy="28" r="3.6" fill="#C98F00"/><text x="300.6" y="32" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#7A5A00">Featured</text>
<circle cx="26" cy="84" r="7.5" fill="#C98F00" fill-opacity=".18"/><g transform="translate(26 84)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#C98F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">QR-based restaurant ordering</text>
<circle cx="26" cy="105" r="7.5" fill="#C98F00" fill-opacity=".18"/><g transform="translate(26 105)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#C98F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="109" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Digital menus for every table</text>
<circle cx="26" cy="126" r="7.5" fill="#C98F00" fill-opacity=".18"/><g transform="translate(26 126)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#C98F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="130" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Order management for the restaurant</text>
<circle cx="26" cy="147" r="7.5" fill="#C98F00" fill-opacity=".18"/><g transform="translate(26 147)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#C98F00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="151" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Commission-based business model</text>
<rect class="st st-yellow" x="14" y="165" width="352" height="46" rx="10" fill="#FFF6D6"/>
<line class="dash" x1="93.5" y1="188" x2="105.5" y2="188" stroke="#C98F00" stroke-width="2" stroke-dasharray="3 3"/><polygon points="108.5,188 103.5,184 103.5,191" fill="#C98F00"/>
<line class="dash" x1="182" y1="188" x2="194" y2="188" stroke="#C98F00" stroke-width="2" stroke-dasharray="3 3"/><polygon points="197,188 192,184 192,191" fill="#C98F00"/>
