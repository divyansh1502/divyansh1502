<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="265" viewBox="0 0 380 265" role="img" aria-label="Sidcup Golf Clone with smooth scrolling and GSAP animations" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sidcup Golf Clone</title>
<style>
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.pk,.kn{animation:mv 3.6s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d));opacity:0}}
.kn{animation:kn 6s linear infinite}
@keyframes kn{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pg{transform-box:fill-box;transform-origin:left center;animation:pg 6s linear infinite}
@keyframes pg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 3.2s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes rv{0%{transform:scaleX(0)}40%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.wh{animation:wh 1.6s ease-in-out infinite}
@keyframes wh{0%{transform:translateY(0);opacity:1}70%{transform:translateY(9px);opacity:0}100%{transform:translateY(0);opacity:0}}
.live{transform-box:fill-box;transform-origin:center;animation:lv 1.4s ease-in-out infinite}
@keyframes lv{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
.vin{transform-box:fill-box;transform-origin:center;animation:vin 6s linear infinite}
@keyframes vin{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){.bg{fill:#0F1530}.tx{fill:#E6EDF3}.st-blue{fill:#16204A}.st-green{fill:#12301D}.st-red{fill:#3A1517}.st-yellow{fill:#3A3010}.st-violet{fill:#2A1B54}}
@media (prefers-reduced-motion:reduce){.sh,.dash,.pk,.kn,.pg,.eq,.rv,.wh,.live,.vin{animation:none}}
</style>
<defs>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#ffffff" fill-opacity=".22"/></pattern>
<pattern id="strp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="9" fill="#ffffff" fill-opacity=".08"/></pattern>
<clipPath id="cc"><rect x="4" y="4" width="372" height="253" rx="16"/></clipPath>
</defs>
<rect x="4" y="8" width="372" height="253" rx="16" fill="#4C1D95"/>
<g clip-path="url(#cc)">
<rect class="bg" x="4" y="4" width="372" height="253" fill="#F6F8FF"/>
<rect x="4" y="4" width="372" height="58" fill="#7C3AED"/><rect x="4" y="4" width="372" height="58" fill="url(#strp)"/><rect x="4" y="4" width="372" height="58" fill="url(#dots)"/>
<rect class="sh" x="-30" y="0" width="24" height="66" fill="#fff" fill-opacity=".26" style="--t:500px"/>
<text x="14" y="48" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#ffffff" fill-opacity=".28">04</text>
<text x="68" y="29" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Sidcup Golf Clone</text>
<text x="68" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" fill-opacity=".9">Frontend · GSAP animations</text>
<rect x="272.8" y="17" width="91.2" height="22" rx="11" fill="#fff"/><circle class="live" cx="284.8" cy="28" r="3.6" fill="#7C3AED"/><text x="293.8" y="32" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#4C1D95">Live demo</text>
<circle cx="26" cy="84" r="7.5" fill="#7C3AED" fill-opacity=".18"/><g transform="translate(26 84)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Frontend recreation of a golf website</text>
<circle cx="26" cy="110" r="7.5" fill="#7C3AED" fill-opacity=".18"/><g transform="translate(26 110)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="114" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Smooth scrolling across sections</text>
<circle cx="26" cy="136" r="7.5" fill="#7C3AED" fill-opacity=".18"/><g transform="translate(26 136)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="140" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Scroll-driven animations with GSAP</text>
<rect class="st st-violet" x="14" y="154" width="352" height="46" rx="10" fill="#F0E9FF"/>
<rect class="rv" x="26" y="165" width="120" height="6" rx="3" fill="#7C3AED" fill-opacity="0.95" style="animation-delay:0s"/>
<rect class="rv" x="26" y="175" width="88" height="6" rx="3" fill="#7C3AED" fill-opacity="0.7" style="animation-delay:0.2s"/>
<rect class="rv" x="26" y="185" width="140" height="6" rx="3" fill="#7C3AED" fill-opacity="0.5" style="animation-delay:0.5s"/>
<text class="tx" x="176" y="181" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#1B2A5C">smooth scroll + GSAP</text>
<rect x="330" y="162" width="18" height="30" rx="9" fill="none" stroke="#7C3AED" stroke-width="2"/><circle class="wh" cx="339" cy="171" r="2.6" fill="#7C3AED"/>
<rect x="22" y="223" width="39.6" height="20" rx="10" fill="#7C3AED"/><text x="41.8" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">HTML</text>
<rect x="67.6" y="223" width="33.7" height="20" rx="10" fill="#4C1D95"/><text x="84.4" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">CSS</text>
<rect x="107.3" y="223" width="75" height="20" rx="10" fill="#7C3AED"/><text x="144.8" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">JavaScript</text>
<rect x="188.3" y="223" width="39.6" height="20" rx="10" fill="#4C1D95"/><text x="208.1" y="237" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">GSAP</text>
</g>
<rect x="4" y="4" width="372" height="253" rx="16" fill="none" stroke="#7C3AED" stroke-width="1.6"/>
</svg>
