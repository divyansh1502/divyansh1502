<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="244" viewBox="0 0 420 244" role="img" aria-label="Sidcup Golf Clone with smooth scrolling and GSAP animations" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Sidcup Golf Clone</title>
<style>
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.pk,.kn{animation:mv 3.6s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d));opacity:0}}
.kn{animation:kn 6s linear infinite}
@keyframes kn{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pg{transform-box:fill-box;transform-origin:left center;animation:pg 6s linear infinite}
@keyframes pg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 3.2s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes rv{0%{transform:scaleX(0)}40%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.wh{animation:wh 1.6s ease-in-out infinite}
@keyframes wh{0%{transform:translateY(0);opacity:1}70%{transform:translateY(9px);opacity:0}100%{transform:translateY(0);opacity:0}}
.live{transform-box:fill-box;transform-origin:center;animation:lv 1.4s ease-in-out infinite}
@keyframes lv{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
@media (prefers-color-scheme:dark){.bg{fill:#0F1530}.tx{fill:#E6EDF3}.st-blue{fill:#16204A}.st-green{fill:#12301D}.st-red{fill:#3A1517}}
@media (prefers-reduced-motion:reduce){.sh,.dash,.pk,.kn,.pg,.eq,.rv,.wh,.live{animation:none}}
</style>
<defs>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#ffffff" fill-opacity=".22"/></pattern>
<pattern id="strp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="9" fill="#ffffff" fill-opacity=".08"/></pattern>
<clipPath id="cc"><rect x="4" y="4" width="412" height="232" rx="16"/></clipPath>
</defs>
<rect x="4" y="8" width="412" height="232" rx="16" fill="#1B3590"/>
<g clip-path="url(#cc)">
<rect class="bg" x="4" y="4" width="412" height="232" fill="#F6F8FF"/>
<rect x="4" y="4" width="412" height="58" fill="#4169E1"/><rect x="4" y="4" width="412" height="58" fill="url(#strp)"/><rect x="4" y="4" width="412" height="58" fill="url(#dots)"/>
<rect class="sh" x="-30" y="0" width="24" height="66" fill="#fff" fill-opacity=".26" style="--t:500px"/>
<text x="14" y="48" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#fff" fill-opacity=".28">05</text>
<text x="68" y="29" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#fff">Sidcup Golf Clone</text>
<text x="68" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#fff" fill-opacity=".9">Frontend · GSAP animations</text>
<rect x="312.8" y="17" width="91.2" height="22" rx="11" fill="#fff"/><circle class="live"  cx="324.8" cy="28" r="3.6" fill="#4169E1"/><text x="333.8" y="32" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1B3590">Live demo</text>
<circle cx="26" cy="84" r="7.5" fill="#4169E1" fill-opacity=".16"/><g transform="translate(26 84)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#4169E1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Frontend recreation of a golf website</text>
<circle cx="26" cy="105" r="7.5" fill="#4169E1" fill-opacity=".16"/><g transform="translate(26 105)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#4169E1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="109" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Smooth scrolling across sections</text>
<circle cx="26" cy="126" r="7.5" fill="#4169E1" fill-opacity=".16"/><g transform="translate(26 126)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#4169E1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="130" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Scroll-driven animations with GSAP</text>
<rect class="st st-blue" x="14" y="144" width="392" height="46" rx="10" fill="#EAF0FF"/>
<rect class="rv" x="26" y="155" width="130" height="6" rx="3" fill="#4169E1" fill-opacity="0.95" style="animation-delay:0s"/>
<rect class="rv" x="26" y="165" width="96" height="6" rx="3" fill="#4169E1" fill-opacity="0.7" style="animation-delay:0.2s"/>
<rect class="rv" x="26" y="175" width="150" height="6" rx="3" fill="#4169E1" fill-opacity="0.5" style="animation-delay:0.5s"/>
<text class="tx" x="196" y="171" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#1B2A5C">smooth scroll + GSAP</text>
<rect x="372" y="152" width="18" height="30" rx="9" fill="none" stroke="#4169E1" stroke-width="2"/><circle class="wh" cx="381" cy="161" r="2.6" fill="#4169E1"/>
<rect x="22" y="202" width="39.6" height="20" rx="10" fill="#4169E1"/><text x="41.8" y="216" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">HTML</text>
<rect x="67.6" y="202" width="33.7" height="20" rx="10" fill="#1B3590"/><text x="84.4" y="216" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">CSS</text>
<rect x="107.3" y="202" width="75" height="20" rx="10" fill="#4169E1"/><text x="144.8" y="216" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">JavaScript</text>
<rect x="188.3" y="202" width="39.6" height="20" rx="10" fill="#1B3590"/><text x="208.1" y="216" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#fff">GSAP</text>
</g>
<rect x="4" y="4" width="412" height="232" rx="16" fill="none" stroke="#4169E1" stroke-width="1.6"/>
</svg>
