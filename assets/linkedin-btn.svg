<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="130" height="68" viewBox="0 0 130 68" role="img" aria-label="Connect on LinkedIn" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Connect on LinkedIn</title>
<style>
.pop,.gnd,.ic,.ar,.sp,.sh{transform-box:fill-box;transform-origin:center;}
.pop{animation:pop 4.5s cubic-bezier(.28,.84,.42,1) infinite;animation-delay:0s;}
@keyframes pop{
0%,30%,100%{transform:translateY(0) scale(1,1)}
4%{transform:translateY(0) scale(1.07,.86)}
11%{transform:translateY(-9px) scale(.95,1.1)}
18%{transform:translateY(0) scale(1.05,.92)}
23%{transform:translateY(-3px) scale(.99,1.02)}
27%{transform:translateY(0) scale(1,1)}
}
.gnd{animation:gnd 4.5s ease-in-out infinite;animation-delay:0s;}
@keyframes gnd{0%,30%,100%{transform:scaleX(1);opacity:.22}11%{transform:scaleX(.78);opacity:.12}18%{transform:scaleX(1.04);opacity:.26}}
.ic{animation:ic 4.5s ease-in-out infinite;animation-delay:0s;}
@keyframes ic{0%,30%,100%{transform:rotate(0deg) scale(1)}12%{transform:rotate(-14deg) scale(1.12)}20%{transform:rotate(8deg) scale(1.04)}25%{transform:rotate(0deg) scale(1)}}
.ar{animation:ar 1.4s ease-in-out infinite;}
@keyframes ar{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.sp{animation:sp 2.4s ease-in-out infinite;}
@keyframes sp{0%,100%{transform:scale(.3) rotate(0deg);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
.sh{animation:sh 3.4s ease-in-out infinite;}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(180px) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.pop,.gnd,.ic,.sp,.sh,.ar{animation:none}}
</style>
<defs>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#ffffff" fill-opacity=".22"/></pattern>
<pattern id="strp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="9" fill="#ffffff" fill-opacity=".07"/></pattern>
<clipPath id="pill"><rect x="4" y="16" width="122" height="40" rx="20"/></clipPath>
</defs>
<ellipse class="gnd" cx="65.0" cy="64" rx="53.0" ry="3" fill="#064785"/>
<rect x="4" y="20" width="122" height="40" rx="20" fill="#064785"/>
<g class="pop">
<rect x="4" y="16" width="122" height="40" rx="20" fill="#0A66C2"/>
<rect x="4" y="16" width="122" height="40" rx="20" fill="url(#strp)"/>
<rect x="4" y="16" width="122" height="40" rx="20" fill="url(#dots)"/>
<g clip-path="url(#pill)"><rect class="sh" x="-30" y="10" width="16" height="52" fill="#ffffff" fill-opacity=".2"/></g>
<rect x="4" y="16" width="122" height="40" rx="20" fill="none" stroke="#ffffff" stroke-width="1.6"/>
<circle cx="25" cy="36" r="14" fill="#ffffff"/>
<circle cx="25" cy="36" r="11.5" fill="none" stroke="#064785" stroke-opacity=".2" stroke-width="1" stroke-dasharray="1.5 3"/>
<g class="ic"><g transform="matrix(.55 0 0 .55 -12.4 4.1)"><g transform="translate(-2.8 0)" fill="#0A66C2"><circle cx="60" cy="49" r="3.4"/><rect x="56.8" y="54" width="6.4" height="18" rx="1"/><path d="M67 54 h6 v2.4 c1.6 -2.2 3.6 -2.9 5.6 -2.9 c4.2 0 6 2.6 6 7 v11.5 h-6.4 v-10 c0 -2.2 -.7 -3.4 -2.6 -3.4 c-2 0 -2.6 1.5 -2.6 3.6 v9.8 h-6 z"/></g></g></g>
<text x="46" y="41" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="600" fill="#ffffff">Connect</text>
<g fill="#ffffff">
<g transform="translate(122 16) scale(.55)"><path class="sp" d="M0 -9 C1 -2 2 -1 9 0 C2 1 1 2 0 9 C-1 2 -2 1 -9 0 C-2 -1 -1 -2 0 -9Z"/></g>
<g transform="translate(10 56) scale(.4)"><path class="sp" style="animation-delay:-1.2s" d="M0 -9 C1 -2 2 -1 9 0 C2 1 1 2 0 9 C-1 2 -2 1 -9 0 C-2 -1 -1 -2 0 -9Z"/></g>
</g>
</g>
</svg>
