<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="150" viewBox="0 0 360 150" role="img" aria-label="Download Resume" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Download Resume</title>
<style>
svg *{transform-box:fill-box;transform-origin:center;}
.pop{animation:pop 4.5s cubic-bezier(.28,.84,.42,1) infinite;}
@keyframes pop{
0%,30%,100%{transform:translateY(0) scale(1,1)}
4%{transform:translateY(0) scale(1.07,.86)}
11%{transform:translateY(-18px) scale(.95,1.1)}
18%{transform:translateY(0) scale(1.05,.92)}
23%{transform:translateY(-5px) scale(.99,1.02)}
27%{transform:translateY(0) scale(1,1)}
}
.gnd{animation:gnd 4.5s ease-in-out infinite;}
@keyframes gnd{0%,30%,100%{transform:scaleX(1);opacity:.22}11%{transform:scaleX(.78);opacity:.12}18%{transform:scaleX(1.04);opacity:.26}}
.ar{animation:ar 1.4s ease-in-out infinite;}
@keyframes ar{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
.sp{animation:sp 2.4s ease-in-out infinite;}
@keyframes sp{0%,100%{transform:scale(.3) rotate(0deg);opacity:.3}50%{transform:scale(1) rotate(45deg);opacity:1}}
.sh{animation:sh 3.4s ease-in-out infinite;}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(460px) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.pop,.gnd,.ar,.sp,.sh{animation:none}}
</style>
<defs>
<pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#ffffff" fill-opacity=".22"/></pattern>
<pattern id="strp" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="5" height="14" fill="#ffffff" fill-opacity=".07"/></pattern>
<clipPath id="pill"><rect x="20" y="20" width="320" height="76" rx="38"/></clipPath>
</defs>
<ellipse class="gnd" cx="180" cy="128" rx="140" ry="7" fill="#1E3A9E"/>
<rect x="20" y="28" width="320" height="76" rx="38" fill="#1B3590"/>
<g class="pop">
<rect x="20" y="20" width="320" height="76" rx="38" fill="#4169E1"/>
<rect x="20" y="20" width="320" height="76" rx="38" fill="url(#strp)"/>
<rect x="20" y="20" width="320" height="76" rx="38" fill="url(#dots)"/>
<g clip-path="url(#pill)"><rect class="sh" x="-70" y="10" width="34" height="96" fill="#ffffff" fill-opacity=".2"/></g>
<rect x="20" y="20" width="320" height="76" rx="38" fill="none" stroke="#FFC83D" stroke-width="2.5"/>
<rect x="30" y="30" width="300" height="56" rx="28" fill="none" stroke="#ffffff" stroke-opacity=".25" stroke-width="1" stroke-dasharray="2 5" stroke-linecap="round"/>
<circle cx="68" cy="58" r="26" fill="#FFC83D"/>
<circle cx="68" cy="58" r="21" fill="none" stroke="#1B3590" stroke-opacity=".18" stroke-width="1.5" stroke-dasharray="2 4"/>
<g fill="none" stroke="#1B3590" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
<path d="M56 46 a3 3 0 0 1 3 -3 h13 l8 8 v21 a3 3 0 0 1 -3 3 h-18 a3 3 0 0 1 -3 -3 z"/>
<path d="M72 43 v8 h8"/>
<g class="ar"><path d="M68 53 v13"/><path d="M62 61 L68 67 L74 61"/></g>
</g>
<text x="108" y="56" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="600" fill="#ffffff">Download Resume</text>
<text x="108" y="77" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#D6E0FF">PDF  ·  click to save</text>
<g fill="#FFC83D">
<path class="sp" transform="translate(332 20)" d="M0 -9 C1 -2 2 -1 9 0 C2 1 1 2 0 9 C-1 2 -2 1 -9 0 C-2 -1 -1 -2 0 -9Z"/>
<path class="sp" style="animation-delay:-1.2s" transform="translate(26 92) scale(.7)" d="M0 -9 C1 -2 2 -1 9 0 C2 1 1 2 0 9 C-1 2 -2 1 -9 0 C-2 -1 -1 -2 0 -9Z"/>
</g>
</g>
</svg>
