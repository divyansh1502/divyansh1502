<svg xmlns="http://www.w3.org/2000/svg" width="320" height="68" viewBox="0 0 320 68" role="img" aria-label="Download Resume" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
.t{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-weight:700}
.m{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
@keyframes shine{0%{transform:translateX(-120px) skewX(-20deg)}55%,100%{transform:translateX(360px) skewX(-20deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(2.5px)}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.shine{animation:shine 3.4s ease-in-out infinite}
.arrow{animation:bob 1.4s ease-in-out infinite}
.glow{animation:glow 2.6s ease-in-out infinite}
.chev{animation:nudge 1.4s ease-in-out infinite}
</style>
<defs>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4F46E5"/><stop offset="0.5" stop-color="#FFD700"/><stop offset="1" stop-color="#2F8D46"/></linearGradient>
<linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="0.5" stop-color="#fff" stop-opacity=".18"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<clipPath id="in"><rect x="8" y="8" width="304" height="52" rx="26"/></clipPath>
<filter id="bl" x="-20%" y="-80%" width="140%" height="260%"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<rect class="glow" x="14" y="14" width="292" height="44" rx="22" fill="url(#bd)" filter="url(#bl)"/>
<rect x="6" y="6" width="308" height="56" rx="28" fill="url(#bd)"/>
<rect x="8" y="8" width="304" height="52" rx="26" fill="#0F172A"/>
<g clip-path="url(#in)"><rect class="shine" x="0" y="0" width="60" height="68" fill="url(#sh)"/></g>
<circle cx="45" cy="34" r="19" fill="#FFD700"/>
<g class="arrow" fill="none" stroke="#0F172A" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
<path d="M45 25v13"/><path d="M39.5 33l5.5 5.5 5.5-5.5"/><path d="M38.5 43h13"/>
</g>
<text class="t" x="78" y="32" font-size="18" fill="#F8FAFC">Download Resume</text>
<text class="m" x="78" y="49" font-size="11.5" fill="#A5B4FC">$ ./Resume.pdf  ·  PDF</text>
<g class="chev" fill="none" stroke="#FFD700" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M285 27l7 7-7 7"/></g>
</svg>
