<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="64" viewBox="0 0 420 64" role="img" aria-label="Tech Stack" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Tech Stack</title>
<style>
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
.ic{transform-box:fill-box;transform-origin:center;animation:ic 3.4s ease-in-out infinite}
@keyframes ic{0%,70%,100%{transform:rotate(0) scale(1)}80%{transform:rotate(-12deg) scale(1.12)}90%{transform:rotate(6deg) scale(1.04)}}
@media (prefers-reduced-motion:reduce){.sh,.ic{animation:none}}
</style>
<defs>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#ffffff" fill-opacity=".22"/></pattern>
<pattern id="strp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="9" fill="#ffffff" fill-opacity=".08"/></pattern>
<clipPath id="p"><rect x="4" y="8" width="412" height="44" rx="22"/></clipPath>
</defs>
<rect x="4" y="12" width="412" height="44" rx="22" fill="#4C1D95"/>
<rect x="4" y="8" width="412" height="44" rx="22" fill="#7C3AED"/>
<rect x="4" y="8" width="412" height="44" rx="22" fill="url(#strp)"/>
<rect x="4" y="8" width="412" height="44" rx="22" fill="url(#dots)"/>
<g clip-path="url(#p)"><rect class="sh" x="-30" y="2" width="24" height="56" fill="#fff" fill-opacity=".28" style="--t:520px"/></g>
<rect x="4" y="8" width="412" height="44" rx="22" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/>
<circle cx="32" cy="30" r="17" fill="#fff"/>
<g class="ic"><g transform="translate(20.5 18.5) scale(.96)" fill="none" stroke="#7C3AED" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" color="#7C3AED"><polygon points="12,3 21,8 12,13 3,8"/><polyline points="3,13 12,18 21,13"/><polyline points="3,17.5 12,22 21,17.5"/></g></g>
<text x="60" y="37" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="18" font-weight="700" fill="#ffffff">Tech Stack</text>
<text x="396" y="35" text-anchor="end" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#ffffff" fill-opacity=".7">// 04</text>
</svg>
