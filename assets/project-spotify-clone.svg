<rect class="eq" x="540" y="148" width="5" height="26" rx="2.5" fill="#2F8D46" style="animation-delay:-0.15s"/>
<rect class="eq" x="550" y="148" width="5" height="26" rx="2.5" fill="#2F8D46" style="animation-delay:-0.4s"/>
<rect class="eq" x="560" y="148" width="5" height="26" rx="2.5" fill="#2F8D46" style="animation-delay:-0.6s"/>
<rect class="eq" x="570" y="148" width="5" height="26" rx="2.5" fill="#2F8D46" style="animation-delay:-0.1s"/>
<rect x="408" y="194" width="320" height="5" rx="2.5" fill="#2F8D46" fill-opacity=".25"/><rect class="pg" x="408" y="194" width="320" height="5" rx="2.5" fill="#2F8D46"/><circle class="kn" cx="408" cy="196.5" r="6" fill="#fff" stroke="#2F8D46" stroke-width="2" style="--d:320px"/>
<rect x="514" y="217" width="3" height="14" rx="1" fill="#2F8D46"/><polygon points="528,217 518,224 528,231" fill="#2F8D46"/>
<circle cx="568" cy="224" r="14" fill="#2F8D46"/><polygon points="565,217 576,224 565,231" fill="#ffffff"/>
<polygon points="608,217 618,224 608,231" fill="#2F8D46"/><rect x="620" y="217" width="3" height="14" rx="1" fill="#2F8D46"/>
<rect x="22" y="234" width="39.6" height="20" rx="10" fill="#2F8D46"/><text x="41.8" y="248" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">HTML</text>
<rect x="67.6" y="234" width="33.7" height="20" rx="10" fill="#1E6B32"/><text x="84.4" y="248" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">CSS</text>
<rect x="107.3" y="234" width="75" height="20" rx="10" fill="#2F8D46"/><text x="144.8" y="248" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">JavaScript</text>
</g>
<rect x="4" y="4" width="752" height="264" rx="16" fill="none" stroke="#2F8D46" stroke-width="1.6"/>
</svg>
