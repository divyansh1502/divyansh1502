<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="276" viewBox="0 0 760 276" role="img" aria-label="Spotify Clone built with HTML, CSS and JavaScript" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Spotify Clone</title>
<style>
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.pk,.kn{animation:mv 3.6s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d));opacity:0}}
.kn{animation:kn 6s linear infinite}
@keyframes kn{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pg{transform-box:fill-box;transform-origin:left center;animation:pg 6s linear infinite}
@keyframes pg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 3.2s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes rv{0%{transform:scaleX(0)}40%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.wh{animation:wh 1.6s ease-in-out infinite}
@keyframes wh{0%{transform:translateY(0);opacity:1}70%{transform:translateY(9px);opacity:0}100%{transform:translateY(0);opacity:0}}
.live{transform-box:fill-box;transform-origin:center;animation:lv 1.4s ease-in-out infinite}
@keyframes lv{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
.vin{transform-box:fill-box;transform-origin:center;animation:vin 6s linear infinite}
@keyframes vin{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){.bg{fill:#0F1530}.tx{fill:#E6EDF3}.st-blue{fill:#16204A}.st-green{fill:#12301D}.st-red{fill:#3A1517}.st-yellow{fill:#3A3010}.st-violet{fill:#2A1B54}}
@media (prefers-reduced-motion:reduce){.sh,.dash,.pk,.kn,.pg,.eq,.rv,.wh,.live,.vin{animation:none}}
</style>
<defs>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#ffffff" fill-opacity=".22"/></pattern>
<pattern id="strp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="9" fill="#ffffff" fill-opacity=".08"/></pattern>
<clipPath id="cc"><rect x="4" y="4" width="752" height="264" rx="16"/></clipPath>
</defs>
<rect x="4" y="8" width="752" height="264" rx="16" fill="#1E6B32"/>
<g clip-path="url(#cc)">
<rect class="bg" x="4" y="4" width="752" height="264" fill="#F6F8FF"/>
<rect x="4" y="4" width="752" height="58" fill="#2F8D46"/><rect x="4" y="4" width="752" height="58" fill="url(#strp)"/><rect x="4" y="4" width="752" height="58" fill="url(#dots)"/>
<rect class="sh" x="-30" y="0" width="24" height="66" fill="#fff" fill-opacity=".26" style="--t:880px"/>
<text x="14" y="48" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#ffffff" fill-opacity=".28">03</text>
<text x="68" y="29" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">Spotify Clone</text>
<text x="68" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" fill-opacity=".9">Frontend · Vanilla JavaScript</text>
<rect x="652.8" y="17" width="91.2" height="22" rx="11" fill="#fff"/><circle class="live" cx="664.8" cy="28" r="3.6" fill="#2F8D46"/><text x="673.8" y="32" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1E6B32">Live demo</text>
<circle cx="26" cy="92" r="7.5" fill="#2F8D46" fill-opacity=".18"/><g transform="translate(26 92)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#2F8D46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="96" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Responsive Spotify-inspired interface</text>
<circle cx="26" cy="122" r="7.5" fill="#2F8D46" fill-opacity=".18"/><g transform="translate(26 122)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#2F8D46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="126" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Play/pause and track switching</text>
<circle cx="26" cy="152" r="7.5" fill="#2F8D46" fill-opacity=".18"/><g transform="translate(26 152)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#2F8D46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="156" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Progress bar synced with the audio</text>
<circle cx="26" cy="182" r="7.5" fill="#2F8D46" fill-opacity=".18"/><g transform="translate(26 182)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#2F8D46" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="186" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Built on the browser audio API</text>
<rect class="st st-green" x="392" y="76" width="352" height="176" rx="14" fill="#E7F5EC"/>
<g transform="translate(408 92)"><rect width="84" height="84" rx="12" fill="#2F8D46"/><g class="vin"><circle cx="42" cy="42" r="34" fill="none" stroke="#fff" stroke-opacity=".35" stroke-width="2"/><circle cx="42" cy="42" r="25" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/><circle cx="42" cy="42" r="16" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2"/><path d="M42 42 L42 10" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><circle cx="42" cy="42" r="5" fill="#fff"/></g>
<text x="510" y="102" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="9.5" font-weight="700" letter-spacing="1.5" fill="#2F8D46">NOW PLAYING</text>
<rect x="510" y="112" width="150" height="10" rx="5" fill="#2F8D46" fill-opacity=".5"/><rect x="510" y="130" width="100" height="8" rx="4" fill="#2F8D46" fill-opacity=".28"/>
<rect class="eq" x="510" y="148" width="5" height="26" rx="2.5" fill="#2F8D46" style="animation-delay:-0s"/>
<rect class="eq" x="520" y="148" width="5" height="26" rx="2.5" fill="#2F8D46" style="animation-delay:-0.25s"/>
