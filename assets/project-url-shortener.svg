<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="380" height="291" viewBox="0 0 380 291" role="img" aria-label="URL Shortener built with Spring Boot and MySQL" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>URL Shortener</title>
<style>
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.pk,.kn{animation:mv 3.6s ease-in-out infinite}
@keyframes mv{0%{transform:translateX(0);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateX(var(--d));opacity:0}}
.kn{animation:kn 6s linear infinite}
@keyframes kn{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pg{transform-box:fill-box;transform-origin:left center;animation:pg 6s linear infinite}
@keyframes pg{0%{transform:scaleX(0)}100%{transform:scaleX(1)}}
.eq{transform-box:fill-box;transform-origin:center bottom;animation:eq .8s ease-in-out infinite alternate}
@keyframes eq{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
.rv{transform-box:fill-box;transform-origin:left center;animation:rv 3.2s cubic-bezier(.2,.8,.3,1) infinite}
@keyframes rv{0%{transform:scaleX(0)}40%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.wh{animation:wh 1.6s ease-in-out infinite}
@keyframes wh{0%{transform:translateY(0);opacity:1}70%{transform:translateY(9px);opacity:0}100%{transform:translateY(0);opacity:0}}
.live{transform-box:fill-box;transform-origin:center;animation:lv 1.4s ease-in-out infinite}
@keyframes lv{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.6);opacity:.5}}
.vin{transform-box:fill-box;transform-origin:center;animation:vin 6s linear infinite}
@keyframes vin{to{transform:rotate(360deg)}}
@media (prefers-color-scheme:dark){.bg{fill:#0F1530}.tx{fill:#E6EDF3}.st-blue{fill:#16204A}.st-green{fill:#12301D}.st-red{fill:#3A1517}.st-yellow{fill:#3A3010}.st-violet{fill:#2A1B54}}
@media (prefers-reduced-motion:reduce){.sh,.dash,.pk,.kn,.pg,.eq,.rv,.wh,.live,.vin{animation:none}}
</style>
<defs>
<pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r=".8" fill="#ffffff" fill-opacity=".22"/></pattern>
<pattern id="strp" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="3" height="9" fill="#ffffff" fill-opacity=".08"/></pattern>
<clipPath id="cc"><rect x="4" y="4" width="372" height="279" rx="16"/></clipPath>
</defs>
<rect x="4" y="8" width="372" height="279" rx="16" fill="#9E1B1E"/>
<g clip-path="url(#cc)">
<rect class="bg" x="4" y="4" width="372" height="279" fill="#F6F8FF"/>
<rect x="4" y="4" width="372" height="58" fill="#E5383B"/><rect x="4" y="4" width="372" height="58" fill="url(#strp)"/><rect x="4" y="4" width="372" height="58" fill="url(#dots)"/>
<rect class="sh" x="-30" y="0" width="24" height="66" fill="#fff" fill-opacity=".26" style="--t:500px"/>
<text x="14" y="48" font-family="Helvetica,Arial,sans-serif" font-size="32" font-weight="800" fill="#ffffff" fill-opacity=".28">02</text>
<text x="68" y="29" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#ffffff">URL Shortener</text>
<text x="68" y="46" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#ffffff" fill-opacity=".9">Backend · REST API</text>
<rect x="272.8" y="17" width="91.2" height="22" rx="11" fill="#fff"/><circle cx="284.8" cy="28" r="3.6" fill="#E5383B"/><text x="293.8" y="32" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#9E1B1E">Repo soon</text>
<circle cx="26" cy="84" r="7.5" fill="#E5383B" fill-opacity=".18"/><g transform="translate(26 84)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#E5383B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="88" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Turns long URLs into short links</text>
<circle cx="26" cy="109" r="7.5" fill="#E5383B" fill-opacity=".18"/><g transform="translate(26 109)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#E5383B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="113" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">REST APIs to create and redirect</text>
<circle cx="26" cy="134" r="7.5" fill="#E5383B" fill-opacity=".18"/><g transform="translate(26 134)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#E5383B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="138" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Unique short code for every URL</text>
<circle cx="26" cy="160" r="7.5" fill="#E5383B" fill-opacity=".18"/><g transform="translate(26 160)"><path d="M-3 0.2 L-0.8 2.5 L3.2 -2.3" fill="none" stroke="#E5383B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></g><text class="tx" x="40" y="164" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" fill="#1B2A5C">Link data stored in MySQL</text>
<rect class="st st-red" x="14" y="178" width="352" height="46" rx="10" fill="#FDEBEC"/>
<line class="dash" x1="93.5" y1="201" x2="105.5" y2="201" stroke="#E5383B" stroke-width="2" stroke-dasharray="3 3"/><polygon points="108.5,201 103.5,197 103.5,204" fill="#E5383B"/>
<line class="dash" x1="182" y1="201" x2="194" y2="201" stroke="#E5383B" stroke-width="2" stroke-dasharray="3 3"/><polygon points="197,201 192,197 192,204" fill="#E5383B"/>
<line class="dash" x1="270.5" y1="201" x2="282.5" y2="201" stroke="#E5383B" stroke-width="2" stroke-dasharray="3 3"/><polygon points="285.5,201 280.5,197 280.5,204" fill="#E5383B"/>
<rect x="22" y="188" width="70.5" height="26" rx="8" fill="#E5383B"/><text x="57.2" y="204.6" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Long URL</text>
<rect x="110.5" y="188" width="70.5" height="26" rx="8" fill="#9E1B1E"/><text x="145.8" y="204.6" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Short code</text>
<rect x="199" y="188" width="70.5" height="26" rx="8" fill="#E5383B"/><text x="234.2" y="204.6" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">MySQL</text>
<rect x="287.5" y="188" width="70.5" height="26" rx="8" fill="#9E1B1E"/><text x="322.8" y="204.6" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Redirect</text>
<circle class="pk" cx="22" cy="201" r="3.6" fill="#fff" stroke="#9E1B1E" stroke-width="1.6" style="--d:336px"/>
<rect x="22" y="249" width="39.6" height="20" rx="10" fill="#E5383B"/><text x="41.8" y="263" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Java</text>
<rect x="67.6" y="249" width="80.9" height="20" rx="10" fill="#9E1B1E"/><text x="108" y="263" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">Spring Boot</text>
<rect x="154.5" y="249" width="69.1" height="20" rx="10" fill="#E5383B"/><text x="189.1" y="263" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">REST APIs</text>
<rect x="229.6" y="249" width="45.5" height="20" rx="10" fill="#9E1B1E"/><text x="252.3" y="263" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="10.5" font-weight="600" fill="#ffffff">MySQL</text>
</g>
<rect x="4" y="4" width="372" height="279" rx="16" fill="none" stroke="#E5383B" stroke-width="1.6"/>
</svg>
