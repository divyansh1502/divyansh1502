<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="360" viewBox="0 0 420 360" role="img" aria-label="About Divyansh: Computer Science and Engineering student building Java backend systems with Spring Boot, REST APIs and MySQL, sharpening problem solving through DSA. Currently learning LLD, System Design, Docker and Kubernetes." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>About me</title>
<style>
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.4s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(0) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
.ln{animation:fi .5s ease-out both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.cur{animation:bl .9s steps(1) infinite}
@keyframes bl{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-color-scheme:dark){.bg{fill:#0F1530}.tx{fill:#E6EDF3}}
@media (prefers-reduced-motion:reduce){.ln,.cur,.sh{animation:none}}
</style>
