<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420" height="258" viewBox="0 0 420 258" role="img" aria-label="Animated skill level bars" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Skill levels</title>
<style>
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 1.6s cubic-bezier(.22,.8,.3,1) both}
.cap{animation:cap 1.6s cubic-bezier(.22,.8,.3,1) both}
.pc{animation:fade .6s ease-out both}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes cap{from{transform:translateX(var(--w))}to{transform:translateX(0)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-color-scheme:dark){.lb{fill:#E6EDF3}.tr{fill:#243055}.pc{fill:#FFC83D}}
@media (prefers-reduced-motion:reduce){.bar,.cap,.pc{animation:none}}
</style>
<g>
<text class="lb" x="16" y="30" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1B2A5C">Java</text>
<rect class="tr" x="136" y="21" width="220" height="10" rx="5" fill="#E3E8F5"/>
<rect class="bar" x="136" y="21" width="187" height="10" rx="5" fill="#4169E1" style="animation-delay:0s"/>
<circle class="cap" cx="323" cy="26" r="6.5" fill="#FFC83D" style="--w:-187px;animation-delay:0s"/>
<text class="pc" x="372" y="30" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1B3590" style="animation-delay:1s">85%</text>
</g>
<g>
<text class="lb" x="16" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1B2A5C">Spring Boot</text>
<rect class="tr" x="136" y="55" width="220" height="10" rx="5" fill="#E3E8F5"/>
<rect class="bar" x="136" y="55" width="176" height="10" rx="5" fill="#4169E1" style="animation-delay:0.15s"/>
<circle class="cap" cx="312" cy="60" r="6.5" fill="#FFC83D" style="--w:-176px;animation-delay:0.15s"/>
<text class="pc" x="372" y="64" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1B3590" style="animation-delay:1.15s">80%</text>
</g>
<g>
<text class="lb" x="16" y="98" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1B2A5C">REST APIs</text>
<rect class="tr" x="136" y="89" width="220" height="10" rx="5" fill="#E3E8F5"/>
<rect class="bar" x="136" y="89" width="176" height="10" rx="5" fill="#4169E1" style="animation-delay:0.3s"/>
<circle class="cap" cx="312" cy="94" r="6.5" fill="#FFC83D" style="--w:-176px;animation-delay:0.3s"/>
<text class="pc" x="372" y="98" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1B3590" style="animation-delay:1.3s">80%</text>
</g>
<g>
<text class="lb" x="16" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1B2A5C">MySQL</text>
<rect class="tr" x="136" y="123" width="220" height="10" rx="5" fill="#E3E8F5"/>
<rect class="bar" x="136" y="123" width="165" height="10" rx="5" fill="#4169E1" style="animation-delay:0.45s"/>
<circle class="cap" cx="301" cy="128" r="6.5" fill="#FFC83D" style="--w:-165px;animation-delay:0.45s"/>
<text class="pc" x="372" y="132" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1B3590" style="animation-delay:1.45s">75%</text>
</g>
<g>
<text class="lb" x="16" y="166" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1B2A5C">DSA</text>
<rect class="tr" x="136" y="157" width="220" height="10" rx="5" fill="#E3E8F5"/>
<rect class="bar" x="136" y="157" width="154" height="10" rx="5" fill="#4169E1" style="animation-delay:0.6s"/>
<circle class="cap" cx="290" cy="162" r="6.5" fill="#FFC83D" style="--w:-154px;animation-delay:0.6s"/>
<text class="pc" x="372" y="166" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1B3590" style="animation-delay:1.6s">70%</text>
</g>
<g>
<text class="lb" x="16" y="200" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1B2A5C">System Design</text>
<rect class="tr" x="136" y="191" width="220" height="10" rx="5" fill="#E3E8F5"/>
<rect class="bar" x="136" y="191" width="99" height="10" rx="5" fill="#4169E1" style="animation-delay:0.75s"/>
<circle class="cap" cx="235" cy="196" r="6.5" fill="#FFC83D" style="--w:-99px;animation-delay:0.75s"/>
<text class="pc" x="372" y="200" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1B3590" style="animation-delay:1.75s">45%</text>
</g>
<g>
<text class="lb" x="16" y="234" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#1B2A5C">Docker &amp; K8s</text>
<rect class="tr" x="136" y="225" width="220" height="10" rx="5" fill="#E3E8F5"/>
<rect class="bar" x="136" y="225" width="77" height="10" rx="5" fill="#4169E1" style="animation-delay:0.9s"/>
<circle class="cap" cx="213" cy="230" r="6.5" fill="#FFC83D" style="--w:-77px;animation-delay:0.9s"/>
<text class="pc" x="372" y="234" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#1B3590" style="animation-delay:1.9s">35%</text>
</g>
</svg>
